<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- A spark in the ramp's own high end: the two stops the map paints a
       plant with under a clear sky, running corner to corner. One mark, no
       stroke and no second glyph, because at 16px anything else silts up. -->
  <defs>
    <linearGradient id="spark" x1="6" y1="3" x2="26" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb23f" />
      <stop offset="1" stop-color="#f4621f" />
    </linearGradient>
  </defs>
  <path
    fill="url(#spark)"
    d="M16 1c0 8.28 6.72 15 15 15-8.28 0-15 6.72-15 15 0-8.28-6.72-15-15-15 8.28 0 15-6.72 15-15Z"
  />
</svg>
